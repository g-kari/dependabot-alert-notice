name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Race regression tests
        run: go test ./... -race -count=1
      - name: Build
        run: go build ./...
      - name: Verify browser UDP audit
        run: |
          node scripts/test_browser_udp_audit.mjs
          node scripts/browser_console_qa.mjs --self-test
      - name: Verify log stream lifecycle
        run: node scripts/test_log_stream_lifecycle.mjs
      - name: Verify Mac packaging helpers
        run: python3 scripts/test_macos_tools.py
      - name: Prepare official Ubuntu CJK font for browser QA
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          source /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 && "$VERSION_CODENAME" == resolute ]]
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          python3 - <<'PY'
          from email.parser import Parser
          from pathlib import Path
          import re
          source = Path('/etc/apt/sources.list.d/ubuntu.sources').read_text()
          assert len(source) <= 65536, 'Ubuntu source exceeds bound'
          allowed = {'http://azure.archive.ubuntu.com/ubuntu/', 'http://archive.ubuntu.com/ubuntu/', 'https://archive.ubuntu.com/ubuntu/', 'http://security.ubuntu.com/ubuntu/', 'https://security.ubuntu.com/ubuntu/'}
          mirror = 'mirror+file:/etc/apt/apt-mirrors.txt'
          entries = re.split(r'\n\s*\n', '\n'.join(line for line in source.splitlines() if not line.lstrip().startswith('#')))
          assert any(entry.strip() for entry in entries), 'Ubuntu source missing'
          for raw in filter(str.strip, entries):
              entry = Parser().parsestr(raw)
              assert not entry.get_payload().strip(), 'Malformed Ubuntu source'
              assert set(entry.keys()) <= {'Types', 'URIs', 'Suites', 'Components', 'Signed-By', 'Enabled', 'Architectures'}, 'Unexpected source field'
              assert all(len(entry.get_all(key, [])) == 1 for key in ['Types', 'URIs', 'Suites', 'Components', 'Signed-By']), 'Missing/duplicate source field'
              assert entry['Types'].split() == ['deb'] and entry.get('Enabled', 'yes').strip() == 'yes'
              assert entry['Signed-By'].strip() == '/usr/share/keyrings/ubuntu-archive-keyring.gpg'
              assert entry['URIs'].split() and set(entry['URIs'].split()) <= allowed | {mirror}, 'Non-Ubuntu source'
              assert entry['Suites'].split() and set(entry['Suites'].split()) <= {'resolute', 'resolute-updates', 'resolute-security', 'resolute-backports'}
              assert 'main' in entry['Components'].split() and set(entry['Components'].split()) <= {'main', 'restricted', 'universe', 'multiverse'}
              if mirror in entry['URIs'].split():
                  lines = Path('/etc/apt/apt-mirrors.txt').read_text().splitlines()
                  assert 0 < len(lines) <= 32, 'Ubuntu mirror list missing/oversized'
                  for line in filter(str.strip, (line.split('#', 1)[0].strip() for line in lines)):
                      words = line.split()
                      assert words[0] in allowed and len(words) <= 2 and all(re.fullmatch(r'priority:[1-3]', word) for word in words[1:]), 'Non-Ubuntu mirror'
          PY
          font_dir=$(mktemp -d "$RUNNER_TEMP/devsecops-cjk-apt.XXXXXX")
          trap 'sudo rm -rf -- "$font_dir"' EXIT
          chmod 755 "$font_dir"
          sudo install -d -o _apt -g root "$font_dir/lists/partial" "$font_dir/archives/partial"
          apt_opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o "Dir::State::lists=$font_dir/lists" -o "Dir::Cache::archives=$font_dir/archives" -o APT::Update::Error-Mode=any -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_opts[@]}" update
          candidate=$(apt-cache "${apt_opts[@]}" policy fonts-noto-cjk | awk '$1 == "Candidate:" {print $2}')
          [[ "$candidate" =~ ^[0-9A-Za-z.+:~_-]+$ ]]
          apt-cache "${apt_opts[@]}" madison fonts-noto-cjk | awk -F '|' -v wanted="$candidate" '{gsub(/^[ \t]+|[ \t]+$/, "", $2); if ($2 == wanted) found=1} END {exit !found}'
          sudo apt-get "${apt_opts[@]}" --simulate --no-install-recommends --reinstall install "fonts-noto-cjk=$candidate" > "$font_dir/transaction.txt"
          awk '/^Remv / {bad=1} /^(Inst|Conf) / {split($2, package, ":"); if (package[1] != "fonts-noto-cjk") bad=1; if ($1 == "Inst" && package[1] == "fonts-noto-cjk") found=1} END {exit bad || !found}' "$font_dir/transaction.txt"
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" --yes --no-install-recommends --reinstall install "fonts-noto-cjk=$candidate"
          [[ $(dpkg-query -W -f='${Version}' fonts-noto-cjk) == "$candidate" ]]
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' fonts-noto-cjk
          fc-match -f '%{family}\n' 'Noto Sans CJK JP:lang=ja' | grep -Fx 'Noto Sans CJK JP'
      - name: Native console browser acceptance
        env:
          DEVSECOPS_BROWSER_QA: "1"
          DEVSECOPS_BROWSER_QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEVSECOPS_BROWSER_QA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEVSECOPS_BROWSER_QA_DIR: ${{ runner.temp }}/devsecops-browser-qa
        run: go test ./internal/web -run '^(TestNativeConsoleBrowserQA|TestBrowserQAOwnedSignalRejectsChangedIdentity|TestBrowserQAOwnedProcessRecoversOrphanAndNodeTimeout)$' -count=1 -timeout=4m
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: devsecops-browser-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/devsecops-browser-qa/*.png
            ${{ runner.temp }}/devsecops-browser-qa/checks.json
            ${{ runner.temp }}/devsecops-browser-qa/manifest.json
            ${{ runner.temp }}/devsecops-browser-qa/stability.json
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          compression-level: 9

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Updater regression tests
        run: go test ./internal/updater/... -count=1
