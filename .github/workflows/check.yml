name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Race regression tests
        run: go test ./... -race -count=1
      - name: Build
        run: go build ./...
      - name: Verify browser UDP audit
        run: |
          node scripts/test_browser_udp_audit.mjs
          node scripts/browser_console_qa.mjs --self-test
      - name: Verify log stream lifecycle
        run: node scripts/test_log_stream_lifecycle.mjs
      - name: Verify Mac packaging helpers
        run: python3 scripts/test_macos_tools.py
      - name: Verify CJK font preparation contract
        run: python3 scripts/test_ci_cjk_font.py
      - name: Prepare official Ubuntu CJK font for browser QA
        timeout-minutes: 3
        shell: bash
        run: bash scripts/prepare_ci_cjk_font.sh
      - name: Native console browser acceptance
        env:
          DEVSECOPS_BROWSER_QA: "1"
          DEVSECOPS_BROWSER_QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEVSECOPS_BROWSER_QA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEVSECOPS_BROWSER_QA_DIR: ${{ runner.temp }}/devsecops-browser-qa
        run: go test ./internal/web -run '^(TestNativeConsoleBrowserQA|TestBrowserQAOwnedSignalRejectsChangedIdentity|TestBrowserQAOwnedProcessRecoversOrphanAndNodeTimeout)$' -count=1 -timeout=4m
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: devsecops-browser-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/devsecops-browser-qa/*.png
            ${{ runner.temp }}/devsecops-browser-qa/checks.json
            ${{ runner.temp }}/devsecops-browser-qa/manifest.json
            ${{ runner.temp }}/devsecops-browser-qa/stability.json
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          compression-level: 9

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Updater regression tests
        run: go test ./internal/updater/... -count=1

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint (new issues on PRs)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          only-new-issues: true
      - name: golangci-lint (full report on push)
        if: github.event_name == 'push'
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          retention-days: 7
          if-no-files-found: error

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go-licenses check
        # modernc.org/mathutil ships a LICENSE file that go-licenses
        # cannot classify, so it is excluded from the automated check.
        run: go run github.com/google/go-licenses@v1.6.0 check ./... --disallowed_types=forbidden,restricted --ignore modernc.org/mathutil
